name: Chạy Code Trên VPS

on:
  push:
    branches: [ "main" ] # Hoặc đổi thành "master" nếu repo của bạn dùng nhánh master

jobs:
  build-and-run:
    runs-on: self-hosted # Dòng này bắt buộc để chỉ định chạy trên VPS của bạn

    steps:
    - name: Kéo code mới nhất về VPS
      uses: actions/checkout@v4

    - name: Kiểm tra thư mục code trên VPS
      run: |
        echo "Đang chạy thử nghiệm trên VPS thành công!"
        ls -la
